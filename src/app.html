<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f3f0e8" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Our Recipes" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
		<link
			rel="icon"
			href="/favicon-32x32-dark.png"
			type="image/png"
			sizes="32x32"
			media="(prefers-color-scheme: dark)"
		/>
		<link rel="icon" href="/favicon-48x48.png" type="image/png" sizes="48x48" />
		<link
			rel="icon"
			href="/favicon-48x48-dark.png"
			type="image/png"
			sizes="48x48"
			media="(prefers-color-scheme: dark)"
		/>
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<meta name="text-scale" content="scale" />
		<script>
			(function () {
				try {
					var key = 'our-recipes-theme';
					var light = '#f3f0e8';
					var dark = '#141a17';
					var stored = localStorage.getItem(key);
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.dataset.theme = theme;
					document.documentElement.style.colorScheme = theme;
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', theme === 'dark' ? dark : light);
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
